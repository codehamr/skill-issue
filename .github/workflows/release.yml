# Release on every push to main, lean version. ONE build job
# proves both binaries, one release job publishes. The release job does not
# EXIST while the build is red (`needs:`), so "tag first, test later, updaters
# stuck on a bad build" cannot happen. Exactly ONE release exists at any time:
# the tag "latest", deleted and recreated every push — no history. The updater
# only ever fetches releases/latest/download/, so the tag NAME is nothing to
# it; it orders builds by the DATE still written into VERSION and SHA256SUMS'
# "# version" header. Rollback is therefore client-side only (each client keeps
# its own exe.old) — no prior release is kept to fall back to. Two
# BINARIES, deliberately: linux-amd64 (desktop + SteamOS) and windows-amd64
# (also covers Windows-on-ARM via its built-in x64 emulation). linux-arm64 was
# dropped 2026-08-08 — no player target, and the aarch64 devcontainer builds
# "dev", which never auto-updates anyway. EVERY published binary asset is one
# the update_asset_name()/entrypoint.sh asset-name contract names — no extra
# browser-only packaging beside it. That is deliberate: the file a player
# downloads and the file the updater fetches are then the same bytes under the
# same name, so they share one SHA256SUMS line and one reputation with the
# download reputation services instead of splitting it in two.
name: Release
on:
  push:
    branches: [main]

# TCB note: actions and the container image run with the release token.
# Pin actions to SHAs and the image to a digest once the repo is public.
# contents: read, not {} — an empty set strips even read, and checkout on a
# private repo then 404s ("repository not found"). The release job alone
# raises itself to contents: write.
permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    # debian:trixie-slim is the devcontainer's image and the only mainstream
    # one where BOTH compilers accept -std=c23 (gcc 12 AND 13 reject it;
    # ubuntu-latest ships gcc 13). Without it the first build fails.
    container: debian:trixie-slim
    steps:
      # Before checkout: actions/checkout needs git in the container.
      # build-essential (not "gcc make"): libc6-dev is only a RECOMMENDS.
      # The mingw METApackage, not -win32: the plain
      # x86_64-w64-mingw32-gcc name is an update-alternatives symlink.
      - name: Toolchain
        run: |
          # force-unsafe-io: dpkg's per-file fsync is pure cost in a container
          # that is discarded after the job — the mingw metapackage alone
          # unpacks ~700 MB and pays it thousands of times.
          echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/ci
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential git ca-certificates \
            libegl-dev libgl-dev libx11-dev \
            libgl1-mesa-dri libglx-mesa0 libegl1 libgl1 libx11-6 \
            gcc-mingw-w64-x86-64
      - uses: actions/checkout@v7

      # BUILD_VERSION/BUILD_COMMIT MUST be passed: without them every binary is
      # a "dev" build and never updates.
      - name: Build
        run: |
          # ONE date for the whole release, stamped ONCE and carried to the publish
          # job as an artifact. Two independent `date -u` calls straddling UTC
          # midnight would put a BUILD_VERSION of day N inside a binary published
          # under a VERSION of day N+1 — and the updater orders by that published
          # date, so every installed client would then see "newer" forever and
          # re-install the same build on every boot.
          V=$(date -u +%Y-%m-%d); C=$(echo ${{ github.sha }} | cut -c1-7)
          echo "$V" > VERSION
          # The two SHIPPED targets only, in parallel — NOT `make all`:
          # build/game is the in-container harness and nothing in this job
          # runs it (ci-proofs drives skill-issue-linux, asan-gate builds its
          # own binary), so building it here is a third full compile for
          # nobody.
          make -j build/game.exe build/game-x86_64 BUILD_VERSION="$V" BUILD_COMMIT="$C"
          # game-x86_64, NOT game: the two are the same compile on an x86_64
          # runner, but only the x86_64 target is guaranteed to be one — and the
          # asset name no longer says amd64, so nothing downstream would catch a
          # wrong-arch binary before it fails on the player's machine with an exec
          # format error. That is the failure the deploy guard exists for and
          # which CI has no equivalent of.
          mv build/game-x86_64 skill-issue-linux
          mv build/game.exe    skill-issue.exe

      # Warning gate WITHOUT LTO (-flto swallows -Wformat-truncation),
      # beside the self-contained proof gate. The build that ships is proved.
      - name: Gate
        run: |
          # Two independent lanes, joined at the end — ci-proofs is this job's
          # wall clock (its vmtrig case alone is ~2 min single-threaded), so
          # the compile gates run BESIDE it, not after it. The step is red if
          # EITHER lane is: a foreground ci-proofs failure fails the step
          # directly, the lane's status is re-raised after the join, and its
          # log is replayed so a lane failure is readable.
          (
            set -e
            # -Wshadow BELONGS HERE. The Makefile passes it on every build but
            # with no -Werror, and this gate had -Werror without it — so
            # nothing in the tree actually enforced the "-Wall -Wextra
            # -Wshadow clean on both compilers" contract, and a shadowed local
            # could ship.
            gcc -std=c23 -O2 -Wall -Wextra -Wshadow -Werror -c code/game.c -o /dev/null
            x86_64-w64-mingw32-gcc -std=c23 -O2 -Wall -Wextra -Wshadow -Werror -c code/game.c -o /dev/null
            # Memory-safety gate: the proof battery (incl. netfuzz, the packet
            # fuzzer) under ASan/UBSan. The Makefile target owns the recipe
            # and the reasoning; ~1 min compile + ~10 s run.
            make asan-gate
          ) >compile-gate.log 2>&1 &
          LANE=$!
          ./tools/ci-proofs.sh ./skill-issue-linux
          lane_status=0; wait "$LANE" || lane_status=$?
          cat compile-gate.log
          exit "$lane_status"

      - uses: actions/upload-artifact@v7
        # "skill-issue*", NOT "skill-issue-*": skill-issue.exe has no dash after
        # the stem. VERSION rides along as the date handoff only — it is NOT a
        # release asset (see Publish).
        with: { name: assets, path: "skill-issue*\nVERSION", if-no-files-found: error }

  release:
    needs: build
    runs-on: ubuntu-latest        # no container: gh is needed here
    permissions: { contents: write }
    concurrency: { group: release-publish, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: assets, path: dist }
      - name: Publish
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          # The build job's date, not a fresh one — see the note there.
          V=$(cat dist/VERSION)
          # upload-artifact drops the x bit; the updater swaps the file in as-is.
          chmod +x dist/skill-issue-linux
          # The tag is fixed ("latest"), so the DATE the updater orders by lives
          # ONLY in this header. Without it an "update" could silently be a
          # downgrade. Sums cover the PUBLISHED assets and nothing else: a row for
          # a file that is not on the release is a 404 waiting to be trusted.
          ( cd dist && { echo "# version $V"; sha256sum skill-issue*; } > SHA256SUMS )
          # Exactly ONE release, always the tag "latest", recreated each push.
          # Delete every existing release+tag first (this also migrates away any
          # old dated releases), drop a dangling "latest" tag so the new tag
          # pins to THIS commit, then publish.
          gh release list --limit 1000 --json tagName -q '.[].tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
          git push origin :refs/tags/latest 2>/dev/null || true
          # Assets named ONE BY ONE, never dist/*: the release page is the product
          # page, and it carries exactly the two binaries a player runs plus the
          # feed that verifies them. VERSION stays behind in dist — nothing
          # fetches it (the client reads SHA256SUMS' header, the server keeps its
          # own copy), so publishing it only adds a row nobody clicks. GitHub's own
          # "Source code (zip/tar.gz)" pair is attached to every tag and cannot be
          # suppressed; that is the whole reason to keep OUR list this short.
          gh release create latest \
            dist/skill-issue.exe dist/skill-issue-linux dist/SHA256SUMS \
            --target "${{ github.sha }}" \
            --title latest --latest --notes-file .github/release-body.md
